name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install pyyaml

      - name: Routing generated
        run: python tools/gen_router.py --check

      - name: Contracts (frontmatter / requires / entry / strict refs)
        run: python tools/check_contracts.py --strict-refs

      - name: Links
        run: python tools/check_links.py

      - name: CVE index
        run: python tools/build_index.py --check

      - name: Data (CVE YAML / index / dataset notices)
        run: python tools/check_data.py --check

      - name: Skill budget
        run: python tools/check_skill_budget.py

      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
